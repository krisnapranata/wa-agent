# Nginx internal wabot (container wabot_nginx, port host 8030).
# Di depannya: Nginx Proxy Manager yang memegang domain + sertifikat HTTPS.

# Pertahankan protokol asli dari NPM; bila diakses langsung, pakai $scheme.
map $http_x_forwarded_proto $proto_asli {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Backend dipanggil dengan NAMA CONTAINER unik, bukan nama service "web": nginx ini juga ada di network NPM,
    # tempat aplikasi lain bisa punya service "web". Resolver + variabel = IP dibaca ulang setelah container dibuat ulang.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://wabot_web:3000;

    # Percayai X-Real-IP hanya dari jaringan privat (NPM/docker).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Aplikasi hanya menerima JSON kecil (tidak ada unggahan berkas).
    client_max_body_size 2m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_asli;
        # Broadcast manual mengirim ke banyak nomor dengan jeda, bisa memakan waktu beberapa menit.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
